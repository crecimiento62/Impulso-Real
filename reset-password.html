<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea tu contraseña — Impulso Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="access-card card">
    <div class="logo"><span class="logo-mark">IR</span>Impulso Real</div>
    <h2>Crea tu contraseña</h2>
    <p class="hint">Este es el último paso para entrar a tu cuenta. La vas a usar cada vez que inicies sesión.</p>

    <form id="resetForm">
      <div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" required placeholder="Mínimo 8 caracteres"></div>
      <div class="field"><label for="confirmPassword">Confirma tu contraseña</label><input id="confirmPassword" type="password" required placeholder="Repítela"></div>
      <p id="resetError" style="color:var(--danger);font-size:12.5px;min-height:16px;margin:-8px 0 12px;"></p>
      <button id="resetBtn" class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Guardar contraseña →</button>
    </form>

    <div id="resetSuccess" class="hidden" style="text-align:center;">
      <p style="color:var(--primary-dark);font-weight:600;">✓ Contraseña guardada. Entrando a tu cuenta...</p>
    </div>
  </div>

  <script type="module" src="js/pages/reset-password.js"></script>
</body>
</html>
